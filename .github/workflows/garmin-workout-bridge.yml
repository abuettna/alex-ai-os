name: Garmin Workout Bridge

on:
  push:
    branches:
      - main
    paths:
      - "garmin-bridge/trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-workout-bridge
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge dependencies
        run: python -m pip install --disable-pip-version-check "garminconnect[workout]>=0.3.5,<1" curl_cffi requests

      - name: Process private workout queue
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: python garmin-bridge/bridge.py
